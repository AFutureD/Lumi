# Temporary: mirrors the release.yml relay job with the deploy replaced by
# whoami + --dry-run, to prove CI credentials and build without deploying.
name: Verify Relay CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Relay job end to end
    runs-on: ubuntu-24.04
    environment: release
    defaults:
      run:
        working-directory: Relay
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and test
        run: |
          set -euo pipefail
          pnpm run check
          pnpm test

      - name: Verify Cloudflare credentials and build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN}"
          pnpm exec wrangler whoami
          pnpm exec wrangler deploy --dry-run
