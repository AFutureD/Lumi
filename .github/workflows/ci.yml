name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  common:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)/Contents/Developer"
      - run: swift build --package-path Common
      - run: swift test --package-path Common
      - run: swift build --package-path Common/AgentStatusTransport
      - run: swift test --package-path Common/AgentStatusTransport
      - run: scripts/check-transport-boundaries.sh

  cli:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)/Contents/Developer"
      - run: swift build --package-path CLI
      - run: swift test --package-path CLI
      - run: scripts/smoke-local-chain.sh

  relay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Relay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run deploy:dry-run

  apps:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode 26
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort -V | tail -1)/Contents/Developer"
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -workspace AgentStatus.xcworkspace
      - name: Build macOS AppKit app
        run: xcodebuild -workspace AgentStatus.xcworkspace -scheme AgentStatusMac -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Test macOS feature package
        run: swift test --package-path Apps/AgentStatusMac/AgentStatusMacPackage
      - name: Build and test iOS UIKit app
        run: xcodebuild -workspace AgentStatus.xcworkspace -scheme AgentStatusIOS -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO test
